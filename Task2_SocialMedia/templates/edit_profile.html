{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body class="bg-light">

<div class="container">
    <div class="row justify-content-center align-items-center vh-100">
        <div class="col-md-5">
            <div class="card shadow border-0 rounded-4">
                <div class="card-body p-4">

                    <div class="d-flex align-items-center mb-4 gap-2">
                        <a href="{% url 'profile' %}" class="text-dark"><i class="fa-solid fa-arrow-left fs-5"></i></a>
                        <h4 class="mb-0 fw-bold">Edit Profile</h4>
                    </div>

                    {% if messages %}
                        {% for msg in messages %}
                        <div class="alert alert-info">{{ msg }}</div>
                        {% endfor %}
                    {% endif %}

                    <div class="text-center mb-4">
                        {% if profile.image %}
                            <img src="{{ profile.image.url }}" class="rounded-circle" width="90" height="90" style="object-fit:cover; border:3px solid #ddd;">
                        {% else %}
                            <img src="{% static 'images/default-avatar.png' %}" class="rounded-circle" width="90" height="90" style="object-fit:cover; border:3px solid #ddd;">
                        {% endif %}
                    </div>

                    <form method="POST" enctype="multipart/form-data">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Profile Photo</label>
                            <input type="file" name="image" class="form-control" accept="image/*">
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">Bio</label>
                            <textarea name="bio" class="form-control" rows="3" placeholder="Write something about yourself...">{{ profile.bio }}</textarea>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 fw-semibold">
                            <i class="fa-solid fa-floppy-disk"></i> Save Changes
                        </button>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
