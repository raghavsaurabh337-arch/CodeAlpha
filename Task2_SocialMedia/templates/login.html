<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }
        .card {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(18px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 20px;
            padding: 44px 36px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        .brand { text-align: center; margin-bottom: 32px; }
        .brand h1 { font-size: 2.4rem; font-weight: 800; color: #fff; letter-spacing: 2px; }
        .brand p { color: rgba(255,255,255,0.65); font-size: 14px; margin-top: 4px; }
        .mb-3 { margin-bottom: 18px; }
        label { color: rgba(255,255,255,0.85); font-size: 13px; margin-bottom: 6px; display: block; }
        .input-group { display: flex; }
        .input-group-text {
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.2);
            border-right: none;
            color: #fff;
            padding: 10px 14px;
            border-radius: 10px 0 0 10px;
            font-size: 14px;
        }
        .form-control {
            flex: 1;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            padding: 10px 14px;
            border-radius: 0 10px 10px 0;
            font-size: 14px;
            outline: none;
        }
        .form-control::placeholder { color: rgba(255,255,255,0.4); }
        .form-control:focus {
            background: rgba(255,255,255,0.15);
            border-color: rgba(255,255,255,0.5);
        }
        .btn-login {
            width: 100%;
            padding: 12px;
            background: linear-gradient(90deg, #833ab4, #fd1d1d, #fcb045);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            margin-top: 8px;
            transition: opacity 0.2s;
        }
        .btn-login:hover { opacity: 0.85; }
        hr { border: none; border-top: 1px solid rgba(255,255,255,0.15); margin: 22px 0; }
        .register-link { text-align: center; color: rgba(255,255,255,0.7); font-size: 14px; }
        .register-link a { color: #fcb045; font-weight: 700; text-decoration: none; }
        .alert-danger {
            background: rgba(255,0,0,0.2);
            border: none;
            color: #ffaaaa;
            border-radius: 8px;
            font-size: 13px;
            padding: 10px 14px;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="brand">
        <h1>✦ SARU</h1>
        <p>Welcome back!</p>
    </div>

    {% if messages %}
        {% for msg in messages %}
        <div class="alert-danger">{{ msg }}</div>
        {% endfor %}
    {% endif %}

    <form method="POST" action="{% url 'login' %}">
        {% csrf_token %}

        <div class="mb-3">
            <label>Email Address</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
                <input type="email" name="email" class="form-control" placeholder="Enter your email" required>
            </div>
        </div>

        <div class="mb-3">
            <label>Password</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                <input type="password" name="password" class="form-control" placeholder="Enter password" required>
            </div>
        </div>

        <button type="submit" class="btn-login">
            <i class="fa-solid fa-right-to-bracket"></i> Login
        </button>
    </form>

    <hr>
    <p class="register-link">Don't have an account? <a href="{% url 'register' %}">Register</a></p>
</div>
</body>
</html>
