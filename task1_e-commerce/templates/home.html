

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyShop</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

{% include "header.html" %} 
<section class="container my-5">

    <h2 class="text-center mb-4">Shop By Category</h2>

    <div class="row text-center">

        <!-- Women's Fashion -->
        <div class="col-md-3">
            <a href="{% url 'women' %}" class="text-decoration-none text-dark">
                <div class="card shadow-sm">
                    <img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=500"
                        class="card-img-top" height="250">
                    <div class="card-body">
                        <h5>Women's Fashion</h5>
                    </div>
                </div>
            </a>
        </div>

        <!-- Men's Fashion -->
        <div class="col-md-3">
            <a href="{% url 'men' %}" class="text-decoration-none text-dark">
                <div class="card shadow-sm">
                    <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?w=500"
                        class="card-img-top" height="250">
                    <div class="card-body">
                        <h5>Men's Fashion</h5>
                    </div>
                </div>
            </a>
        </div>

        <!-- Kids Wear -->
        <div class="col-md-3">
            <a href="{% url 'kids' %}" class="text-decoration-none text-dark">
                <div class="card shadow-sm">
                    <img src="https://images.unsplash.com/photo-1512436991641-6745cdb1723f?w=500"
                        class="card-img-top" height="250">
                    <div class="card-body">
                        <h5>Kids Wear</h5>
                    </div>
                </div>
            </a>
        </div>

        <!-- Accessories -->
        <div class="col-md-3">
            <a href="{% url 'Accessories' %}" class="text-decoration-none text-dark">
                <div class="card shadow-sm">
                    <img src="https://images.unsplash.com/photo-1523170335258-f5ed11844a49?w=500"
                        class="card-img-top" height="250">
                    <div class="card-body">
                        <h5>Accessories</h5>
                    </div>
                </div>
            </a>
        </div>

    </div>

</section>
 {% include "footer.html" %} 
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
